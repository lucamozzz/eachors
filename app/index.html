<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" type="text/css" href="styles/app.less" />
  <title>[chor-js] Demo</title>
  <style>
    .form-bottom-left {
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: none;
      padding: 0;
      margin: 0;
      border-radius: 0;
      z-index: 10;
    }
    #canvas {
      position: relative;
    }
    .token-animation-controls {
      position: relative;
      z-index: 100;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div id="split-container">
    <div class="content">
      <div id="canvas">
        <ul class="corner-links">
          <li>
            <a href="https://bpt.hpi.uni-potsdam.de/legal/" title="Legal notice" target="_blank">legal notice</a>
          </li>
          <li>
            <a class="git-info icon-github-circled" href="https://github.com/bptlab/chor-js-demo" target="_blank"
              title="Contribute on GitHub"></a>
          </li>
        </ul>
         <!-- FORM DI TEST - INIZIO -->
  <div class="form-bottom-left">
    <label for="elementId" style="margin-right: 8px;">Elemento BPMN:</label>
    <select id="elementId">
      <option value="Message_1pam53q">Pizza Order</option>
      <!-- Aggiungi altre opzioni qui se hai altri ID noti! -->
    </select>
    <input type="color" id="color" value="#FF0000" style="margin-left:8px;margin-right:8px;">
    <button onclick="window.colorElement(
      document.getElementById('elementId').value,
      document.getElementById('color').value
    )">Applica colore</button>
  </div>
  <!-- FORM DI TEST - FINE -->

  <!-- Form per animare un edge -->
<div class="form-bottom-left" style="bottom: 120px;">
  <label for="edgeId" style="margin-right: 8px;">Sequence Flow:</label>
  <select id="edgeId">
    <!-- Le opzioni verranno popolate via JS -->
  </select>
  <button onclick="window.animateEdge(document.getElementById('edgeId').value)">Anima edge</button>
</div>
      </div>


      <div id="panel-toggle">
        <div data-toggle-panel="properties-panel" title="Toggle properties panel"><span>Properties</span></div>
      </div>
      <div id="properties-panel" class="side-panel hidden"></div>
      <div id="resizer"></div>
      <div id="bpenv-container"></div>
    </div>
  </div>

  <div class="buttons djs-container">
    <button id="js-new-diagram" class="icon-doc-new" title="Create new empty diagram"></button>
    <button id="js-open-file" class="icon-folder" title="Select BPMN XML file"></button>
    <div class="divider"></div>
    <a id="js-download-diagram" class="icon-file-code" title="Download BPMN XML file"></a>
    <a id="js-download-svg" class="icon-file-image" title="Download as SVG image"></a>
    <div class="divider"></div>
    <button id="js-validate" class="icon-bug" title="Check diagram for problems"></button>
  </div>

  <input id="file-input" name="name" type="file" accept=".bpmn, .xml" style="display: none;" />
  <script src="./app.js"></script>
</body>
</html>
